<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hilton Niseko Village — Hotel Information</title>
<meta name="description" content="Dining hours, facilities and services for guests of Hilton Niseko Village.">

<style>
/* =============================================================
   ESTILOS COMPARTIDOS — LANDING PAGES
   ============================================================= */

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400;500;600&display=swap');

:root {
  --navy:      #16283F;
  --navy-soft: #23405F;
  --gold:      #B08D3C;
  --gold-lt:   #D6B767;
  --cream:     #FBF9F5;
  --mist:      #EEF2F6;
  --ink:       #26292E;
  --gray:      #6E6A64;
  --line:      #E0DACE;
  --white:     #FFFFFF;
  --teal:      #1E5F6B;
  --moss:      #2F5D45;
}

* , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation: none !important; transition: none !important; }
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--cream);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.jp { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', YuMincho, serif; }

.wrap { max-width: 880px; margin: 0 auto; background: var(--white); box-shadow: 0 0 60px rgba(0,0,0,0.05); }

/* ── HERO ───────────────────────────────────────── */
.hero {
  background: var(--navy);
  color: var(--white);
  padding: 3.5rem 1.75rem 2.75rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 25% 0%, rgba(176,141,60,0.22), transparent 55%);
  pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }

.eyebrow {
  display: inline-block;
  font-size: 0.68rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold-lt);
  border: 1px solid rgba(214,183,103,0.4);
  padding: 0.32rem 0.95rem;
  border-radius: 999px;
  margin-bottom: 1.35rem;
}
.hotel-name {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-weight: 300;
  font-size: clamp(1.9rem, 5.5vw, 3rem);
  letter-spacing: 0.03em;
  line-height: 1.12;
}
.hotel-name-jp {
  font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  font-weight: 300;
  font-size: clamp(1.1rem, 3vw, 1.4rem);
  color: var(--gold-lt);
  margin-top: 0.45rem;
}
.rule { width: 44px; height: 1px; background: var(--gold); margin: 1.15rem auto; }
.hero-copy { color: rgba(255,255,255,0.68); font-size: 0.89rem; max-width: 520px; margin: 0 auto; line-height: 1.7; }
.hero-month {
  display: inline-block; margin-top: 1.35rem;
  font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-lt);
}

/* ── LANG BAR ───────────────────────────────────── */
.langbar {
  display: flex; justify-content: center; gap: 0.4rem;
  padding: 0.85rem 1rem; border-bottom: 1px solid var(--line);
  background: var(--white); position: sticky; top: 0; z-index: 20;
}
.langbtn {
  background: none; border: 1px solid var(--line); border-radius: 999px;
  padding: 0.55rem 1.35rem; min-height: 42px; font-size: 0.82rem; cursor: pointer;
  color: var(--gray); font-family: inherit; transition: all 0.18s;
  display: inline-flex; align-items: center; justify-content: center;
}
.langbtn:hover { border-color: var(--gold); color: var(--navy); }
.langbtn[aria-pressed="true"] { background: var(--navy); color: var(--white); border-color: var(--navy); }
.langbtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ── CALLOUTS ───────────────────────────────────── */
.callout {
  margin: 1.5rem 1.75rem;
  border-radius: 10px;
  padding: 1.4rem 1.5rem;
  color: var(--white);
  position: relative;
  overflow: hidden;
}
.callout--gold  { background: linear-gradient(135deg, var(--navy), var(--navy-soft)); }
.callout--teal  { background: linear-gradient(135deg, var(--teal), #2A7C8A); }
.callout--moss  { background: linear-gradient(135deg, var(--moss), #3F7A5C); }
.callout h3 {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 1.25rem; font-weight: 500; color: var(--gold-lt); margin-bottom: 0.5rem;
}
.callout h3.jp { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 1.05rem; }
.callout p { font-size: 0.85rem; color: rgba(255,255,255,0.78); line-height: 1.7; }
.callout .big {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size: 1.75rem;
  color: var(--gold-lt); margin: 0.35rem 0 0.55rem; letter-spacing: 0.02em;
}
.callout ul { list-style: none; margin-top: 0.6rem; }
.callout li {
  font-size: 0.8rem; color: rgba(255,255,255,0.75); line-height: 1.75;
  padding-left: 1.1rem; position: relative;
}
.callout li::before { content: '★'; position: absolute; left: 0; color: var(--gold-lt); font-size: 0.7rem; top: 0.35rem; }

/* ── TAX NOTICE ─────────────────────────────────── */
.notice {
  margin: 1.5rem 1.75rem 0;
  border-left: 3px solid var(--gold);
  background: linear-gradient(90deg, rgba(176,141,60,0.09), rgba(176,141,60,0.02));
  padding: 0.95rem 1.25rem;
  border-radius: 0 6px 6px 0;
}
.notice p { font-size: 0.82rem; color: var(--gray); line-height: 1.65; }

/* ── SECTIONS ───────────────────────────────────── */
.section { padding: 2.25rem 1.75rem; border-top: 1px solid var(--line); }
.section:first-of-type { border-top: none; }
.section-head { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.4rem; }
.section-head .mark {
  width: 34px; height: 34px; flex-shrink: 0; border-radius: 8px;
  background: linear-gradient(135deg, var(--navy), var(--navy-soft));
  color: var(--gold-lt); display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem;
}
.section-head h2 {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-weight: 500;
  font-size: 1.45rem; color: var(--navy); letter-spacing: 0.01em;
}
.section-head h2.jp { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 1.15rem; font-weight: 500; }

/* ── TABLE ──────────────────────────────────────── */
.tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 520px; }
table.tbl th {
  background: var(--navy); color: var(--white); font-weight: 400;
  padding: 0.65rem 0.85rem; text-align: left;
  font-size: 0.72rem; letter-spacing: 0.07em; text-transform: uppercase;
}
table.tbl th:nth-child(4) { text-align: center; }
table.tbl td { padding: 0.7rem 0.85rem; border-bottom: 1px solid var(--mist); vertical-align: middle; line-height: 1.5; }
table.tbl td.cell-hours { text-align: center; }
table.tbl tr:last-child td { border-bottom: none; }
table.tbl tbody tr:nth-child(even) td { background: rgba(238,242,246,0.4); }
.floor { font-weight: 600; color: var(--navy); font-size: 0.78rem; white-space: nowrap; }
.meal {
  display: inline-block; font-size: 0.68rem; padding: 0.15rem 0.55rem;
  border-radius: 999px; background: var(--mist); color: var(--gray); white-space: nowrap;
}
.sub { display: block; font-size: 0.74rem; color: var(--gray); margin-top: 0.15rem; min-height: 1.05em; }
.foot-note {
  margin-top: 0.9rem; padding: 0.85rem 1rem; background: var(--mist);
  border-radius: 6px; font-size: 0.79rem; color: var(--gray); line-height: 1.7;
}

/* ── FACILITY CARDS ─────────────────────────────── */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0.9rem; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 1.05rem; background: var(--white); }
.card .fl {
  font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--gold); font-weight: 600; margin-bottom: 0.35rem;
}
.card h4 { font-size: 0.92rem; color: var(--navy); font-weight: 600; margin-bottom: 0.35rem; }
.card h4.jp { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-weight: 500; }
.card .hrs { font-size: 0.82rem; color: var(--ink); margin-bottom: 0.35rem; }
.card .nt { font-size: 0.75rem; color: var(--gray); line-height: 1.6; }

/* ── SERVICE ROWS ───────────────────────────────── */
.svc { display: flex; flex-direction: column; gap: 0.75rem; }
.svc-row {
  display: grid; grid-template-columns: 150px 1fr; gap: 1rem;
  padding: 0.9rem 1rem; background: var(--mist); border-radius: 8px; align-items: start;
}
.svc-row dt {
  font-size: 0.82rem; font-weight: 600; color: var(--navy);
  letter-spacing: 0.01em;
}
.svc-row dt.jp { font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif; text-transform: none; letter-spacing: 0.02em; font-size: 0.85rem; }
.svc-row dd { font-size: 0.85rem; color: var(--ink); line-height: 1.7; }
.code {
  display: inline-block; background: var(--navy); color: var(--gold-lt);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  padding: 0.1rem 0.5rem; border-radius: 4px; font-size: 0.85rem; letter-spacing: 0.06em;
}

/* ── CHECKOUT ───────────────────────────────────── */
.checkout { background: var(--mist); border-radius: 8px; padding: 1.35rem 1.5rem; }
.checkout .time {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size: 2.1rem;
  color: var(--navy); font-weight: 300; line-height: 1; margin-bottom: 0.6rem;
}
.checkout p { font-size: 0.83rem; color: var(--gray); line-height: 1.8; }

/* ── FOOTER ─────────────────────────────────────── */
.foot {
  background: var(--navy); color: rgba(255,255,255,0.45);
  text-align: center; padding: 1.75rem 1.5rem;
  font-size: 0.74rem; letter-spacing: 0.06em;
}
.foot strong { color: var(--gold-lt); font-weight: 500; }
.foot .stamp { display: block; margin-top: 0.5rem; font-size: 0.68rem; opacity: 0.6; }

/* ── UTIL ───────────────────────────────────────── */
[hidden] { display: none !important; }
.loading { padding: 4rem 2rem; text-align: center; color: var(--gray); font-size: 0.85rem; }

@media (max-width: 600px) {
  .hero { padding: 2.75rem 1.25rem 2.25rem; }
  .section { padding: 1.85rem 1.25rem; }
  .callout, .notice { margin-left: 1.25rem; margin-right: 1.25rem; }
  .cards { grid-template-columns: 1fr; }
  .svc-row { grid-template-columns: 1fr; gap: 0.3rem; }

  /* La tabla se apila en tarjetas — sin scroll lateral */
  .tbl-scroll { overflow-x: visible; }
  table.tbl { min-width: 0; display: block; }
  table.tbl thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  table.tbl tbody { display: block; }
  table.tbl tr {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.15rem 0.6rem;
    align-items: baseline;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.75rem 0.9rem;
    margin-bottom: 0.6rem;
    background: var(--white);
  }
  table.tbl tbody tr:nth-child(even) td { background: transparent; }
  table.tbl td { display: block; border: none; padding: 0; }

  /* Nombre del restaurante como título, ocupando toda la fila */
  table.tbl td.cell-name {
    grid-column: 1 / -1;
    order: 1;
    font-weight: 600;
    color: var(--navy);
    font-size: 0.92rem;
    margin-bottom: 0.35rem;
  }
  /* Piso y comida en línea, como etiquetas */
  table.tbl td:nth-child(1) { grid-column: 1 / -1; order: 0; }
  table.tbl td:nth-child(3) { grid-column: 1 / -1; order: 2; margin-bottom: 0.3rem; }
  table.tbl td:nth-child(3):empty { display: none; }
  table.tbl td.cell-hours { grid-column: 1 / -1; order: 3; font-size: 0.86rem; text-align: left; }

  table.tbl td.cell-hours::before {
    content: attr(data-l);
    display: block;
    font-size: 0.64rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: 0.15rem;
  }
  .floor { font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
}

/* ── SECTION INTRO ──────────────────────────────── */
.section-intro { font-size: .84rem; color: var(--gray); line-height: 1.7; margin: -0.6rem 0 1.1rem; }

/* ── NOTICE LINK ────────────────────────────────── */
.notice-link {
  display: inline-flex; align-items: center; gap: .3rem;
  min-height: 40px; margin-top: .35rem; font-size: .82rem; font-weight: 600;
  color: var(--navy); text-decoration: none; border-bottom: 1px solid var(--gold);
  padding-bottom: 1px;
}
.notice-link:hover { color: var(--gold); }

/* ── USEFUL LINK CARDS ──────────────────────────── */
.linkgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .7rem; }
.linkcard {
  position: relative; display: flex; flex-direction: column; gap: .18rem;
  border: 1px solid var(--line); border-radius: 8px; padding: .9rem 2.1rem .9rem 1rem;
  background: var(--white); text-decoration: none; color: var(--navy);
  transition: border-color .16s, background .16s, transform .16s;
}
.linkcard:hover { border-color: var(--gold); background: #FCFAF5; }
.linkcard:active { transform: scale(.99); }
.linkcard:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.linkcard-label { display: block; font-size: .88rem; font-weight: 600; line-height: 1.35; }
.linkcard-note  { display: block; font-size: .74rem; color: var(--gray); line-height: 1.4; margin-top: 0.15rem; }
.linkcard-go {
  position: absolute; right: .85rem; top: 50%; transform: translateY(-50%);
  color: var(--gold); font-size: .85rem;
}

/* Links inside the dining table */
table.tbl a {
  display: inline-flex; align-items: center; gap: .25rem;
  min-height: 40px; padding: .25rem 0;
  color: var(--navy); text-decoration: none; font-weight: 600;
}
table.tbl a span { color: var(--gold); }
table.tbl a:hover { color: var(--gold); }
table.tbl a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 3px; }

@media (max-width: 600px) {
  .linkgrid { grid-template-columns: 1fr; }
}

/* ── SAFETY BANNER (above dining table) ─────────── */
.safety-banner {
  background: #FFF6D6; border: 1px solid #EBD98A; color: #6B5A12;
  font-size: .82rem; font-weight: 600; padding: .6rem .9rem;
  border-radius: 6px; margin-bottom: 1rem; line-height: 1.5;
}

/* ── WI-FI BOX ──────────────────────────────────── */
.wifi-box {
  background: var(--mist); border-radius: 8px; padding: 1rem 1.15rem;
}
.wifi-box p { font-size: .85rem; color: var(--ink); line-height: 1.75; }

/* ── WINDOW / INSECT NOTICE ─────────────────────── */
.window-notice {
  margin-top: 1rem; font-size: .78rem; color: #A33; line-height: 1.6;
  border-left: 3px solid #E8A0A0; padding-left: .7rem;
}

/* ── LINK CARD DETAILS (QR concierge sub-bullets) ── */
.linkcard-details { list-style: none; margin-top: .3rem; padding: 0; }
.linkcard-details li {
  font-size: .72rem; color: var(--gray); line-height: 1.55; padding-left: .8rem; position: relative;
}
.linkcard-details li::before { content: '·'; position: absolute; left: 0; color: var(--gold); }

/* ── PLAIN LIST (callout bullets without the ★ prefix) ── */
ul.plain { list-style: none; }
ul.plain li {
  font-size: .8rem; color: rgba(255,255,255,.8); line-height: 1.75; padding-left: 0;
}
ul.plain li::before { content: none; }

/* ── LIVE UPDATE TOAST ──────────────────────────── */
.updated-flash {
  position: fixed;
  bottom: 1.1rem;
  left: 50%;
  transform: translate(-50%, 160%);
  background: var(--navy);
  color: var(--gold-lt);
  padding: 0.6rem 1.2rem;
  border-radius: 999px;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  box-shadow: 0 8px 30px rgba(0,0,0,.22);
  z-index: 300;
  transition: transform .35s ease;
  pointer-events: none;
}
.updated-flash.show { transform: translate(-50%, 0); }

/* ── LINK CARDS (printed as QR codes originally) ── */
.section-intro { font-size: 0.83rem; color: var(--gray); margin-bottom: 1rem; line-height: 1.6; }

.linkgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 0.7rem; }

.linkcard {
  display: block;
  position: relative;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.9rem 2.1rem 0.9rem 1rem;
  background: var(--white);
  text-decoration: none;
  transition: border-color .16s, background .16s, transform .16s;
}
.linkcard:hover { border-color: var(--gold); background: #FDFBF6; }
.linkcard:active { transform: translateY(1px); }
.linkcard:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.linkcard-name { display: block; font-size: 0.88rem; font-weight: 600; color: var(--navy); line-height: 1.35; }
.linkcard-desc { display: block; font-size: 0.74rem; color: var(--gray); margin-top: 0.2rem; line-height: 1.45; }
.linkcard-go {
  position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%);
  color: var(--gold); font-size: 0.9rem;
}

/* link inside the tax notice */
.notice-link {
  display: inline-block; margin-top: 0.5rem;
  font-size: 0.79rem; color: var(--navy); font-weight: 600;
  text-decoration: none; border-bottom: 1px solid var(--gold); padding-bottom: 1px;
}
.notice-link:hover { color: var(--gold); }

/* link inside a table row (room service) */
.row-link { color: var(--navy); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--gold); }
.row-link:hover { color: var(--gold); }
</style>
</head>

/* =============================================================
   SYNC LAYER
   Talks to this site's own /api/content endpoint.
   Falls back to this browser's storage if the server is not
   reachable — so the file still works opened by double-click.
   ============================================================= */

var HotelSync = (function () {
  "use strict";

  var LOCAL_KEY  = "hnv_content";
  var API        = "/api/content";
  var POLL_SECS  = 15;

  var serverUp = null;   // null = unknown yet

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* Arrays of objects that carry an `id` are merged item-by-item:
     - an id present in both keeps the saved edits, filled in with any
       fields the default has that the saved copy doesn't (so a brand
       new field, or a brand new row added to defaults.js later, always
       shows up even for a site that already has saved content)
     - an id only in the saved copy (something added via the admin) is kept
     - an id only in the defaults (a new row shipped later) is added
     `showIn` is unioned rather than overwritten, so a page added to a
     row in defaults.js later (e.g. Pirka becoming available on Non-HH
     and JTB) reaches a site that already saved an older, narrower
     showIn — unless the admin explicitly removed that page, which is
     tracked separately in _hiddenShowIn so it isn't undone. */
  function mergeArrayById(base, saved, deletedIds, hiddenShowIn) {
    deletedIds = deletedIds || [];
    hiddenShowIn = hiddenShowIn || {};
    var baseIndex = {}, baseById = {}, savedById = {};
    base.forEach(function (item, i) { if (item && item.id != null) { baseIndex[item.id] = i; baseById[item.id] = item; } });
    saved.forEach(function (item) { if (item && item.id != null) savedById[item.id] = item; });

    /* Rows that exist in both keep whatever relative order the saved
       copy has them in — if the admin used the ↑ / ↓ buttons, that
       ordering survives. Rows the admin added by hand (no match in
       defaults.js) go to the end, also in saved order. */
    var sharedIds = [], customOnlyIds = [];
    saved.forEach(function (item) {
      if (!item || item.id == null) return;
      (baseById[item.id] ? sharedIds : customOnlyIds).push(item.id);
    });

    /* Rows only in defaults.js are new — shipped after this content
       was last saved (or freshly un-deleted from the tombstone list:
       never, tombstones stay excluded here). Slot each one next to
       the neighbour it has in defaults.js, so a new dish lands
       between the right two courses instead of at the very end. */
    var newOnlyIds = base
      .filter(function (item) {
        return item && item.id != null && !savedById[item.id] && deletedIds.indexOf(item.id) === -1;
      })
      .map(function (item) { return item.id; });

    var order = sharedIds.slice();
    newOnlyIds.forEach(function (id) {
      var bi = baseIndex[id], insertAt = -1, i, sib, pos;
      for (i = bi - 1; i >= 0 && insertAt === -1; i--) {
        sib = base[i] && base[i].id;
        pos = sib != null ? order.indexOf(sib) : -1;
        if (pos !== -1) insertAt = pos + 1;
      }
      if (insertAt === -1) {
        for (i = bi + 1; i < base.length && insertAt === -1; i++) {
          sib = base[i] && base[i].id;
          pos = sib != null ? order.indexOf(sib) : -1;
          if (pos !== -1) insertAt = pos;
        }
      }
      order.splice(insertAt === -1 ? order.length : insertAt, 0, id);
    });
    order = order.concat(customOnlyIds);

    return order.map(function (id) {
      if (baseById[id] && savedById[id]) {
        var merged = merge(baseById[id], savedById[id], deletedIds, hiddenShowIn);
        var union = {};
        (baseById[id].showIn || []).forEach(function (p) { union[p] = true; });
        (savedById[id].showIn || []).forEach(function (p) { union[p] = true; });
        var hidden = hiddenShowIn[id] || [];
        merged.showIn = Object.keys(union).filter(function (p) { return hidden.indexOf(p) === -1; });
        return merged;
      }
      if (baseById[id]) return clone(baseById[id]);
      return clone(savedById[id]);
    });
  }

  function isIdList(arr) {
    return Array.isArray(arr) && arr.length > 0 &&
      arr.every(function (item) { return item && typeof item === "object" && item.id != null; });
  }

  /* Merge saved content over the defaults so new fields — and new
     rows (or new pages added to an existing row's showIn) shipped
     later in defaults.js — never get lost behind an older saved
     copy. Rows or pages the admin explicitly removed stay removed,
     via the _deletedIds and _hiddenShowIn tombstones. */
  function merge(base, saved, deletedIds, hiddenShowIn) {
    if (deletedIds === undefined) deletedIds = (saved && saved._deletedIds) || [];
    if (hiddenShowIn === undefined) hiddenShowIn = (saved && saved._hiddenShowIn) || {};
    if (!saved || typeof saved !== "object") return clone(base);
    var out = clone(base);
    Object.keys(saved).forEach(function (k) {
      if (k === "_deletedIds")   { out._deletedIds   = clone(saved._deletedIds   || []); return; }
      if (k === "_hiddenShowIn") { out._hiddenShowIn = clone(saved._hiddenShowIn || {}); return; }
      if (Array.isArray(saved[k])) {
        if (isIdList(out[k]) || isIdList(saved[k])) out[k] = mergeArrayById(out[k] || [], saved[k], deletedIds, hiddenShowIn);
        else out[k] = clone(saved[k]);
      }
      else if (saved[k] && typeof saved[k] === "object") out[k] = merge(out[k] || {}, saved[k], deletedIds, hiddenShowIn);
      else out[k] = saved[k];
    });
    return out;
  }

  function readLocal() {
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function writeLocal(data) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); return true; }
    catch (e) { return false; }
  }

  /* ── PUBLIC ────────────────────────────────── */

  /* Returns { data, source } — source is 'server' | 'local' | 'default' */
  async function load() {
    try {
      var res = await fetch(API, { cache: "no-store" });
      if (res.ok) {
        serverUp = true;
        var body = await res.json();
        if (body && body.content) return { data: merge(DEFAULT_CONTENT, body.content), source: "server" };
        return { data: clone(DEFAULT_CONTENT), source: "default" };
      }
      throw new Error("HTTP " + res.status);
    } catch (e) {
      serverUp = false;
      var local = readLocal();
      return {
        data: merge(DEFAULT_CONTENT, local),
        source: local ? "local" : "default",
        offline: true
      };
    }
  }

  async function save(data) {
    data.meta = data.meta || {};
    data.meta.updatedAt = new Date().toISOString();
    writeLocal(data);

    try {
      var res = await fetch(API, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: data })
      });
      if (res.status === 401) {
        window.location.href = "/login";
        throw new Error("Session expired — redirecting to sign in.");
      }
      if (!res.ok) {
        var txt = await res.text().catch(function () { return ""; });
        throw new Error("Server refused the save (" + res.status + ") " + txt.slice(0, 120));
      }
      serverUp = true;
      return { ok: true, source: "server" };
    } catch (e) {
      serverUp = false;
      return { ok: false, source: "local", error: e.message };
    }
  }

  /* Calls cb(data) whenever the content changes elsewhere. */
  function subscribe(cb) {
    var lastStamp = null;
    var timer = null;

    async function check() {
      try {
        var res = await load();
        var stamp = (res.data.meta && res.data.meta.updatedAt) || "";
        if (lastStamp === null) { lastStamp = stamp; return; }
        if (stamp !== lastStamp) { lastStamp = stamp; cb(res.data); }
      } catch (e) { /* keep showing the last good copy */ }
    }

    function start() { stop(); timer = setInterval(check, POLL_SECS * 1000); }
    function stop()  { if (timer) { clearInterval(timer); timer = null; } }

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) stop();
      else { check(); start(); }
    });

    window.addEventListener("storage", function (e) {
      if (e.key === LOCAL_KEY) load().then(function (r) { cb(r.data); });
    });

    load().then(function (r) { lastStamp = (r.data.meta && r.data.meta.updatedAt) || ""; });
    start();
  }

  function reset() {
    try { localStorage.removeItem(LOCAL_KEY); } catch (e) {}
    return clone(DEFAULT_CONTENT);
  }

  function filterFor(list, page) {
    return (list || []).filter(function (r) { return !r.showIn || r.showIn.indexOf(page) !== -1; });
  }

  function isOnline() { return serverUp === true; }

  return {
    load: load, save: save, subscribe: subscribe, reset: reset,
    merge: merge, filterFor: filterFor, isOnline: isOnline, LOCAL_KEY: LOCAL_KEY
  };
})();

/* =============================================================
   PAGE RENDERER
   buildHTML(data, page, lang, opts) is pure — same function used
   by the live landing pages and by the admin's preview panel.
   ============================================================= */

var HotelRender = (function () {
  "use strict";

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function escML(s) {
    return esc(s).replace(/\r?\n/g, "<br>");
  }
  function isJP(l) { return l === "jp"; }
  function jpc(l)  { return isJP(l) ? " jp" : ""; }

  var L = {
    en: {
      links: "Useful Links", restaurants: "Restaurants and Room Service",
      facilities: "Hotel Facilities", wifi: "Wi-Fi", services: "Other Services",
      checkout: "Check-out Time",
      venue: "Venue", restaurant: "Restaurant", meal: "Meal", hours: "Operating Hours"
    },
    jp: {
      links: "各種ご案内", restaurants: "レストラン、ルームサービス",
      facilities: "施設案内", wifi: "インターネット（Wi-Fi）", services: "サービス",
      checkout: "チェックアウト",
      venue: "場所", restaurant: "店舗名", meal: "食事", hours: "営業時間"
    }
  };

  function filterFor(list, page) {
    return (list || []).filter(function (r) { return !r.showIn || r.showIn.indexOf(page) !== -1; });
  }

  /* If every field of a row was cleared out in the admin, skip it
     entirely on the public pages instead of leaving an empty gap. */
  function isBlank(v) { return v == null || String(v).trim() === ""; }

  function restaurantHasContent(r) {
    return !(isBlank(r.nameEn) && isBlank(r.nameJp) && isBlank(r.mealEn) && isBlank(r.mealJp) &&
             isBlank(r.hoursEn) && isBlank(r.hoursJp) && isBlank(r.noteEn) && isBlank(r.noteJp) && isBlank(r.url));
  }
  function facilityHasContent(f) {
    return !(isBlank(f.nameEn) && isBlank(f.nameJp) && isBlank(f.hoursEn) && isBlank(f.hoursJp) &&
             isBlank(f.notesEn) && isBlank(f.notesJp));
  }
  function serviceHasContent(s) {
    return !(isBlank(s.labelEn) && isBlank(s.labelJp) && isBlank(s.valueEn) && isBlank(s.valueJp));
  }
  function linkHasContent(l) {
    return !(isBlank(l.labelEn) && isBlank(l.labelJp) && isBlank(l.url));
  }
  function nonBlankLines(arr) {
    return (arr || []).filter(function (s) { return !isBlank(s); });
  }

  /* ── HERO ────────────────────────────────────── */
  function heroHTML(data, page, lang) {
    var j = isJP(lang);
    var pg = (data.pages && data.pages[page]) || {};
    var badge = (j ? pg.badgeJp : pg.badgeEn) || "";
    var intro = (j ? pg.introJp : pg.introEn) || "";
    return (badge ? '<span class="eyebrow' + jpc(lang) + '">' + esc(badge) + '</span>' : '') +
      '<h1 class="hotel-name">' + esc(data.meta.hotelName) + '</h1>' +
      (j ? '<div class="hotel-name-jp">' + esc(data.meta.hotelNameJP) + '</div>' : '') +
      '<div class="rule"></div>' +
      (intro ? '<p class="hero-copy' + jpc(lang) + '">' + escML(intro) + '</p>' : '') +
      '<span class="hero-month">' + esc(j ? data.meta.monthJP : data.meta.month) + '</span>';
  }

  /* ── TAX NOTICE ──────────────────────────────── */
  function taxHTML(data, lang) {
    var j = isJP(lang), t = data.tax || {};
    var url = j ? t.urlJp : t.urlEn;
    var label = (j ? t.linkJp : t.linkEn) || url;
    return '<div class="notice">' +
      '<p class="' + (j ? "jp" : "") + '">' + escML(j ? t.jp : t.en) + '</p>' +
      (t.en2 || t.jp2 ? '<p class="' + (j ? "jp" : "") + '" style="margin-top:.5rem">' + escML(j ? t.jp2 : t.en2) + '</p>' : '') +
      (url ? '<a class="notice-link" href="' + esc(url) + '" target="_blank" rel="noopener">' +
             esc(label) + ' <span aria-hidden="true">↗</span></a>' : '') +
      '</div>';
  }

  /* ── USEFUL LINKS ────────────────────────────── */
  function linksHTML(data, page, lang) {
    var j = isJP(lang), t = L[lang];
    var items = filterFor(data.links, page).filter(linkHasContent);
    if (!items.length) return "";

    var cards = items.map(function (it) {
      var url   = it.url;
      var label = (j ? it.labelJp : it.labelEn) || it.labelEn;
      var note  = j ? it.noteJp : it.noteEn;
      var details = nonBlankLines(j ? it.detailsJp : it.detailsEn);
      var detailsHTML = (details && details.length)
        ? '<ul class="linkcard-details' + jpc(lang) + '">' +
            details.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') +
          '</ul>'
        : '';
      if (!url) return '';
      return '<a class="linkcard" href="' + esc(url) + '" target="_blank" rel="noopener">' +
               '<span class="linkcard-label' + jpc(lang) + '">' + esc(label) + '</span>' +
               (note ? '<span class="linkcard-note' + jpc(lang) + '">' + esc(note) + '</span>' : '') +
               detailsHTML +
               '<span class="linkcard-go" aria-hidden="true">↗</span>' +
             '</a>';
    }).join("");

    return '<section class="section">' +
      '<div class="section-head"><span class="mark" aria-hidden="true">◎</span>' +
      '<h2 class="' + (j ? "jp" : "") + '">' + esc(t.links) + '</h2></div>' +
      '<div class="linkgrid">' + cards + '</div>' +
    '</section>';
  }

  /* ── RESTAURANTS ─────────────────────────────── */
  function restaurantsHTML(data, page, lang) {
    var j = isJP(lang), t = L[lang];
    var rows = filterFor(data.restaurants, page).filter(restaurantHasContent);
    if (!rows.length) return "";

    var body = rows.map(function (r) {
      var name = j ? r.nameJp : r.nameEn;
      var meal = j ? (r.mealJp || r.mealEn) : (r.mealEn || r.mealJp);
      var hrs  = j ? r.hoursJp : r.hoursEn;
      var note = j ? r.noteJp : r.noteEn;
      var nameCell = r.url
        ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(name) + ' <span aria-hidden="true">↗</span></a>'
        : esc(name);
      return '<tr>' +
        '<td data-l="' + esc(t.venue) + '"><span class="floor">' + esc((j && r.floorJp) || r.floor) + '</span></td>' +
        '<td data-l="' + esc(t.restaurant) + '" class="cell-name ' + (j ? "jp" : "") + '">' + nameCell + '</td>' +
        '<td data-l="' + esc(t.meal) + '">' + (meal ? '<span class="meal' + jpc(lang) + '">' + esc(meal) + '</span>' : '') + '</td>' +
        '<td data-l="' + esc(t.hours) + '" class="cell-hours ' + (j ? "jp" : "") + '">' + esc(hrs) +
          '<span class="sub">' + esc(note) + '</span></td>' +
      '</tr>';
    }).join("");

    var safety = data.restaurantSafety ? (j ? data.restaurantSafety.jp : data.restaurantSafety.en) : "";
    var foot   = data.restaurantNote   ? (j ? data.restaurantNote.jp   : data.restaurantNote.en)   : "";

    return '<section class="section">' +
      '<div class="section-head"><span class="mark" aria-hidden="true">◆</span>' +
      '<h2 class="' + (j ? "jp" : "") + '">' + esc(t.restaurants) + '</h2></div>' +
      (safety ? '<p class="safety-banner' + jpc(lang) + '">' + esc(safety) + '</p>' : '') +
      '<div class="tbl-scroll"><table class="tbl">' +
        '<thead><tr><th>' + esc(t.venue) + '</th><th>' + esc(t.restaurant) + '</th>' +
        '<th>' + esc(t.meal) + '</th><th>' + esc(t.hours) + '</th></tr></thead>' +
        '<tbody>' + body + '</tbody>' +
      '</table></div>' +
      (foot ? '<p class="foot-note' + jpc(lang) + '">' + escML(foot) + '</p>' : '') +
    '</section>';
  }

  /* ── FACILITIES ──────────────────────────────── */
  function facilitiesHTML(data, page, lang) {
    var j = isJP(lang), t = L[lang];
    var items = filterFor(data.facilities, page).filter(facilityHasContent);
    if (!items.length) return "";

    var cards = items.map(function (f) {
      var name  = j ? f.nameJp : f.nameEn;
      var hrs   = j ? f.hoursJp : f.hoursEn;
      var notes = j ? f.notesJp : f.notesEn;
      return '<article class="card">' +
        '<div class="fl">' + esc((j && f.floorJp) || f.floor) + '</div>' +
        '<h4 class="' + (j ? "jp" : "") + '">' + esc(name) + '</h4>' +
        (hrs ? '<div class="hrs' + jpc(lang) + '">' + esc(hrs) + '</div>' : '') +
        (notes ? '<p class="nt' + jpc(lang) + '">' + escML(notes) + '</p>' : '') +
      '</article>';
    }).join("");

    return '<section class="section">' +
      '<div class="section-head"><span class="mark" aria-hidden="true">▲</span>' +
      '<h2 class="' + (j ? "jp" : "") + '">' + esc(t.facilities) + '</h2></div>' +
      '<div class="cards">' + cards + '</div>' +
    '</section>';
  }

  /* ── WI-FI (single row, page-specific content) ──── */
  function wifiHTML(data, page, lang) {
    var j = isJP(lang), t = L[lang], w = data.wifi || {};
    var pageBlock = w[page] || {};
    var val = j ? pageBlock.valueJp : pageBlock.valueEn;
    if (!val) return "";
    return '<section class="section">' +
      '<div class="section-head"><span class="mark" aria-hidden="true">📶</span>' +
      '<h2 class="' + (j ? "jp" : "") + '">' + esc(t.wifi) + '</h2></div>' +
      '<div class="wifi-box">' +
        '<p class="' + (j ? "jp" : "") + '">' + escML(val) + '</p>' +
      '</div>' +
    '</section>';
  }

  /* ── OTHER SERVICES ──────────────────────────── */
  function servicesHTML(data, page, lang) {
    var j = isJP(lang), t = L[lang];
    var rows = filterFor(data.services, page).filter(serviceHasContent);
    if (!rows.length) return "";
    var body = rows.map(function (s) {
      return '<div class="svc-row">' +
        '<dt class="' + (j ? "jp" : "") + '">' + esc(j ? s.labelJp : s.labelEn) + '</dt>' +
        '<dd class="' + (j ? "jp" : "") + '">' + escML(j ? s.valueJp : s.valueEn) + '</dd>' +
      '</div>';
    }).join("");
    return '<section class="section">' +
      '<div class="section-head"><span class="mark" aria-hidden="true">✦</span>' +
      '<h2 class="' + (j ? "jp" : "") + '">' + esc(t.services) + '</h2></div>' +
      '<dl class="svc">' + body + '</dl>' +
    '</section>';
  }

  /* ── JTB LOUNGE ──────────────────────────────── */
  function jtbLoungeHTML(data, page, lang) {
    if (page !== "jtb") return "";
    var jt = data.jtb || {};
    var notes = nonBlankLines(jt.loungeNotes).map(function (n) { return '<li class="jp">' + esc(n) + '</li>'; }).join("");
    return '<div class="callout callout--gold">' +
             '<h3 class="jp">' + esc(jt.loungeTitle) + '</h3>' +
             '<p class="jp">' + esc(jt.loungeLocation) + '</p>' +
             '<div class="big">' + esc(jt.loungeHours) + '</div>' +
             '<ul class="plain">' + notes + '</ul>' +
           '</div>';
  }

  /* ── PREMIUM CLUB (Japanese only, any page) ──── */
  function premiumClubHTML(data, lang) {
    if (!isJP(lang)) return "";
    var pc = data.premiumClub; if (!pc) return "";
    var bullets = nonBlankLines(pc.bulletsJp).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join("");
    return '<div class="callout callout--teal">' +
             '<h3 class="jp">' + esc(pc.titleJp) + '</h3>' +
             '<ul class="plain jp">' + bullets + '</ul>' +
           '</div>';
  }

  /* ── WINDOW / INSECT NOTICE ──────────────────── */
  function windowNoticeHTML(data, lang) {
    var j = isJP(lang), w = data.windowNotice; if (!w) return "";
    var txt = j ? w.jp : w.en; if (!txt) return "";
    return '<p class="window-notice' + jpc(lang) + '">' + escML(txt) + '</p>';
  }

  /* ── CHECK-OUT ───────────────────────────────── */
  function checkoutHTML(data, page, lang) {
    var j = isJP(lang), t = L[lang];
    var pg = (data.pages && data.pages[page]) || {};
    var txt = j ? pg.checkoutJp : pg.checkoutEn;
    if (!txt) return "";
    return '<section class="section">' +
      '<div class="section-head"><span class="mark" aria-hidden="true">■</span>' +
      '<h2 class="' + (j ? "jp" : "") + '">' + esc(t.checkout) + '</h2></div>' +
      '<div class="checkout">' +
        '<div class="time">' + esc(data.meta.checkoutTime) + (j ? "まで" : " a.m.") + '</div>' +
        '<p class="' + (j ? "jp" : "") + '">' + escML(txt) + '</p>' +
      '</div>' +
      windowNoticeHTML(data, lang) +
    '</section>';
  }

  /* ── FOOTER ──────────────────────────────────── */
  function footHTML(data, page, lang, footNote) {
    var j = isJP(lang);
    var stamp = data.meta.updatedAt
      ? new Date(data.meta.updatedAt).toLocaleString(j ? "ja-JP" : "en-GB", { dateStyle: "medium", timeStyle: "short" })
      : "";
    return '<strong>' + esc(j ? data.meta.hotelNameJP : data.meta.hotelName) + '</strong> · ' +
      esc(j ? data.meta.monthJP : data.meta.month) +
      (footNote ? ' · ' + esc(footNote) : '') +
      (stamp ? '<span class="stamp">Updated ' + esc(stamp) + '</span>' : '');
  }

  var FOOT_NOTE = { hh: "", nonhh: "", jtb: "JTB" };

  /* ── PURE BUILD (used by both production pages and the admin preview) ── */
  function buildHTML(data, page, lang) {
    var langs = page === "jtb" ? ["jp"] : ["en", "jp"];
    var langbar = langs.length > 1
      ? '<nav class="langbar" aria-label="Language">' +
          langs.map(function (l) {
            return '<button class="langbtn" type="button" data-lang="' + l + '" aria-pressed="' +
                   (l === lang) + '">' + (l === "jp" ? "日本語" : "English") + '</button>';
          }).join("") +
        '</nav>'
      : "";

    return '<div class="wrap">' +
      '<header class="hero">' + heroHTML(data, page, lang) + '</header>' +
      langbar +
      taxHTML(data, lang) +
      restaurantsHTML(data, page, lang) +
      jtbLoungeHTML(data, page, lang) +
      facilitiesHTML(data, page, lang) +
      wifiHTML(data, page, lang) +
      servicesHTML(data, page, lang) +
      checkoutHTML(data, page, lang) +
      linksHTML(data, page, lang) +
      premiumClubHTML(data, lang) +
      '<footer class="foot">' + footHTML(data, page, lang, FOOT_NOTE[page]) + '</footer>' +
    '</div>';
  }

  /* ── MOUNT (production pages: fetches + live-syncs) ─────────── */
  async function mount(opts) {
    var root = document.getElementById("app");
    var langs = opts.page === "jtb" ? ["jp"] : ["en", "jp"];
    var lang = langs[0];
    var data = null;

    function draw() {
      root.innerHTML = buildHTML(data, opts.page, lang);
      Array.prototype.forEach.call(root.querySelectorAll(".langbtn"), function (b) {
        b.addEventListener("click", function () {
          lang = b.dataset.lang;
          document.documentElement.lang = lang === "jp" ? "ja" : "en";
          draw();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function flash() {
      var el = document.createElement("div");
      el.className = "updated-flash";
      el.textContent = lang === "jp" ? "最新の情報に更新されました" : "Updated just now";
      document.body.appendChild(el);
      requestAnimationFrame(function () { el.classList.add("show"); });
      setTimeout(function () {
        el.classList.remove("show");
        setTimeout(function () { el.remove(); }, 400);
      }, 2600);
    }

    var first = await HotelSync.load();
    data = first.data;
    document.documentElement.lang = lang === "jp" ? "ja" : "en";
    draw();

    HotelSync.subscribe(function (fresh) {
      data = fresh;
      var y = window.scrollY;
      draw();
      window.scrollTo(0, y);
      flash();
    });
  }

  return { mount: mount, buildHTML: buildHTML, esc: esc, escML: escML, filterFor: filterFor };
})();

HotelRender.mount({ page: "nonhh" });
</script>
